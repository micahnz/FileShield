[protected_paths]
# Cloud credentials
~/.aws/credentials
~/.aws/config
~/.azure/
~/.config/gcloud/

# Kubernetes
~/.kube/config
~/.kube/cache/

# SSH
~/.ssh/

# GPG / age / SOPS
~/.gnupg/
~/.config/sops/

# Password managers & vaults
~/.password-store/
~/.config/op/
~/.vault-token
~/.config/vault/

# Container registries
~/.docker/config.json
~/.config/helm/repositories.yaml

# Terraform
~/.terraform.d/credentials.tfrc.json
~/.terraformrc

# SCM tokens
~/.config/gh/hosts.yml
# ~/.gitconfig

# GitHub Actions / CI secrets
~/.config/github-copilot/
~/.config/hub

# General
~/.netrc
~/.env

[settings]
# TTL (seconds) granted when the user clicks "Allow Once" for an unknown
# process.  Applies per process and per file: the process may reopen that
# exact file until the TTL expires.  Config [allowlist] hits also refresh
# the cache with this TTL; rules no longer carry a per-entry TTL.
# 0 disables caching (each open prompts again).
user_ttl = 300

# TTL cap (seconds) for "Allow Session" / "Deny Session" decisions.
# 0 means the decision lives exactly as long as the shell session (the POSIX
# session leader): closing the terminal / opening a new one prompts again.
# A non-zero value additionally expires session decisions after that many
# seconds even if the terminal is still open.
session_ttl = 0

# Log the per-event debug details ([event]/[dedup]/[pump] plumbing) in
# addition to the one-line-per-access INFO record.  Off by default; the
# daemon's -d/--debug flag enables the same thing for a single run.
debug = no

[allowlist]
# The allowlist is intentionally empty by default.
#
# Pre-allowlisting binaries is risky: a compromised or replaced binary at the
# same path would gain silent access to every protected resource.
# Add entries only for tools you have verified and trust explicitly.
#
# Format: /absolute/path/to/binary = /path/to/target/file
#
# A scoped entry grants the binary access to that one target file or
# folder (matching is "equal or under", so a trailing slash is optional).
# A bare binary line with no '=' is a GLOBAL rule: the binary may access
# every protected path.  A binary may appear on multiple lines with
# different targets when it needs exceptions for more than one file or
# folder.  '~' expands for every user's home, like [protected_paths].
#
# Examples (commented out — opt-in explicitly):
# /usr/bin/ssh            = ~/.ssh/known_hosts
# /usr/bin/kubectl        = ~/.kube/config
# /usr/bin/kubectl        = ~/.kube/cache/
# /usr/bin/gpg            = ~/.gnupg/
# /usr/local/bin/aws      = ~/.aws/config

[denylist]
# The denylist is intentionally empty by default.
#
# Format matches [allowlist]: "/path/to/binary = /path/to/target" denies
# the binary access to that one file or folder; a bare binary line denies
# every protected path.  Denials are always evaluated before any grant
# (config allowlist included), and no dialog is shown for a denied
# attempt — the open simply fails with EPERM.
#
# Examples (commented out — opt-in explicitly):
# /usr/bin/curl = ~/.netrc
# /tmp/x                       # global deny for a specific binary
