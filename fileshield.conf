[protected_paths]

# Entries may use glob wildcards:
#   *   matches within one path segment, never '/', and matches dotfiles
#   **  whole-segment wildcard: matches zero or more path segments
# Examples:
#   ~/.cloudflared/*.json      files directly in that directory
#   ~/.cloudflared/**/*.json   the same files at any depth
#   ~/.ssh/id_*                key material inside ~/.ssh
# Patterns must be absolute after '~' expansion; '?', '[', ']' and '\'
# are literal; matching is case-sensitive and full-path (use '**' for a
# subtree).  A malformed pattern is rejected at load with a log message.
#
# Prefix a line with '!' to exclude matching paths.  Exclusions win over
# positives, in any order:
#   ~/.ssh/                    protect the directory
#   !~/.ssh/*.pub              ...but not public keys directly inside
#   !~/.ssh/**/*.pub           ...nor nested public keys

