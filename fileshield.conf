[settings]
# TTL (seconds) granted when the user clicks "Allow Once" for an unknown
# process.  Applies per process and per file: the process may reopen that
# exact file until the TTL expires.  Config [allowlist] hits also refresh
# the cache with this TTL; rules no longer carry a per-entry TTL.
# 0 disables caching (each open prompts again).
user_ttl = 300

# TTL cap (seconds) for "Allow Session" / "Deny Session" decisions.
# 0 means the decision lives exactly as long as the shell session (the POSIX
# session leader): closing the terminal / opening a new one prompts again.
# A non-zero value additionally expires session decisions after that many
# seconds even if the terminal is still open.
session_ttl = 0

# Log the per-event debug details ([event]/[dedup]/[pump] plumbing) in
# addition to the one-line-per-access INFO record.  Off by default; the
# daemon's -d/--debug flag enables the same thing for a single run.
debug = no

[allowlist]
# Hash-pinned allowlist
#
# Pre-allowlisting binaries is risky: a compromised or replaced binary
# would otherwise gain silent access to every protected resource.  To
# bound that risk, the first matching access silently pins the binary's
# SHA-512; later accesses must match the pin, and a changed hash needs
# your explicit approval.  Add entries only for tools you have verified
# and trust explicitly.
#
# Format: /absolute/path/to/binary = /path/to/target/file
#
# A scoped entry grants the binary access to that one target file or
# folder (matching is "equal or under", so a trailing slash is optional).
# A bare binary line with no '=' is a GLOBAL rule: the binary may access
# every protected path.  A binary may appear on multiple lines with
# different targets when it needs exceptions for more than one file or
# folder.  '~' expands for every user's home, like [protected_paths].
#
# Globs are supported on both sides, with the [protected_paths] syntax:
#   *   matches within one path segment, never '/', and matches dotfiles
#   **  whole-segment wildcard: matches zero or more path segments
# Exact binary = path equality; exact target = equal or under; a glob
# target is matched full-path, so write '/**' when it should cover a
# whole subtree.  '?', '[', ']' and '\' are literal; matching is
# case-sensitive.  A malformed pattern is rejected at load with a log.
#
# Hash pinning: the pin is keyed by the rule's canonical binary pattern
# (the left-hand side of the rule), not by the resolved path.
#   - First match with no stored pin: the SHA-512 is stored silently
#     (the state file is written immediately) and the access is allowed.
#   - Later match, same digest: allowed.
#   - Changed digest: a dialog shows the rule, binary, old and new
#     16-hex digest prefixes, target and command.  Only "Update & Allow"
#     updates the pin and allows the access; No, Cancel, window close
#     and timeouts deny this attempt only and keep the old pin (the next
#     access re-prompts, subject to the dialog rate limiter).
#   - Digest unavailable (hash failure, or a binary under a protected
#     path, which is deliberately not hashed) or a damaged state file:
#     the normal Allow Once/Session/Always dialog is shown - never a
#     silent grant - until the state file is repaired or removed.
#
# Because a glob rule pins the pattern itself, an AppImage keeps working
# across random mount paths; but two different binaries matching the same
# glob rule share one pin, so switching between them triggers the change
# prompt.  Use [unsafe_allowlist] for binaries that churn too much.
#
# State file: /var/lib/fileshield/allowlist-hashes.json (root-only,
# 0600, written atomically).  A missing file is normal first use.  At
# most 256 entries are kept; the oldest entry is evicted when a new one
# is stored.  The file is re-read on startup and on every SIGHUP reload.
# There is no CLI: the dialog is the only way to update a pin; root may
# inspect or edit the JSON directly.
#
# Examples (commented out — opt-in explicitly):
# /usr/bin/ssh            = ~/.ssh/known_hosts
# /usr/bin/kubectl        = ~/.kube/config
# /usr/bin/kubectl        = ~/.kube/cache/
# /usr/bin/gpg            = ~/.gnupg/
# /usr/local/bin/aws      = ~/.aws/config

# opencode binary and its data directory

/usr/bin/gpg-agent      = ~/.gnupg/
/usr/bin/bash           = ~/.bash_history
/usr/bin/zsh            = ~/.zsh_history
/nix/store/*/bin/zsh    = ~/.zsh_history
/nix/store/*/bin/bash   = ~/.bash_history

/usr/bin/opencode       = ~/.local/share/opencode/
/opt/warpdotdev/warp-terminal/warp = ~/.zsh_history

[unsafe_allowlist]
# Pin-free allowlist, intentionally empty by default.
#
# Rules here use the exact same format as [allowlist] (globs and '~'
# included), but a hit grants immediately and is NEVER hash-checked or
# hash-pinned: the binary is trusted unconditionally (its digest may
# still be computed for the runtime deny/allow pipeline, but nothing
# compares or stores it for these rules).  This section is
# evaluated BEFORE [allowlist].  Use it only for tools whose binary
# genuinely cannot be pinned - AppImages or other tmp-mount tools whose
# binary churns, or tools reinstalled/upgraded many times a day.  Prefer
# [allowlist] whenever the binary is stable enough to pin.
#
# Format: /absolute/path/to/binary = /path/to/target/file
#
# Globs are supported on both sides with the [protected_paths] syntax:
#   *   matches within one path segment, never '/', and matches dotfiles
#   **  whole-segment wildcard: matches zero or more path segments
# Exact binary = path equality; exact target = equal or under (a trailing
# slash is optional); a glob target is matched full-path, so write '/**'
# for a whole subtree.  '?', '[', ']' and '\' are literal; matching is
# case-sensitive.  A malformed pattern is rejected at load with a log.
# A bare binary line with no '=' is a GLOBAL rule.  A binary may appear
# on multiple lines with different targets.
#
# Examples (commented out — opt-in explicitly):

# openchamber AppImage, dynamically mounted and cannot be hashed
/tmp/.mount_OpenCh*/openchamber = ~/.local/share/opencode/

[denylist]
# The denylist is intentionally empty by default.
#
# Format matches [allowlist] (globs on both sides included):
# "/path/to/binary = /path/to/target" denies the binary access to that
# one file or folder; a bare binary line denies every protected path.
# Denials are always evaluated before any grant ([unsafe_allowlist] and
# [allowlist] included), and no dialog is shown for a denied attempt —
# the open simply fails with EPERM.  Deny rules are never hash-pinned or
# hash-checked: a pin detects a replaced allowlisted binary, while a deny
# blocks the access no matter which binary matches.
#
# Examples (commented out — opt-in explicitly):
# /usr/bin/curl = ~/.netrc
# /tmp/x                       # global deny for a specific binary
